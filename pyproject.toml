[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flightbridge"
version = "1.8.2"
description = "FlightBridge AI engine: regulator-listed flying-school research, qualification and approval-gated outreach for We One Aviation"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1", "requests>=2.31", "cryptography>=41", "openpyxl>=3.1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flightbridge*"]

[tool.setuptools.package-data]
flightbridge = ["config/*.json", "registers/**/*.csv", "migrations/*.sql"]
