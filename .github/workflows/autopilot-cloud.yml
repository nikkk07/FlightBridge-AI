# Email Auto-Pilot, cloud backup: sends when the Mac Mini is off.
# Runs every 10 minutes on weekdays, 13:00-20:59 UTC (school hours across the USA, standard and daylight time).
# Each run first checks the Mac: if the Mac reported in the last 3 minutes it does nothing. Otherwise it reads replies,
# makes due follow-ups, then takes an Auto-Pilot step every 30 seconds for 9 minutes (at most one email per step).
# Every email still passes the same gates, the kill switch, the daily pace and the owner's ON/OFF switch in the CRM.
# Public repository: the run log shows only counts and state names. Needs two repository secrets:
#   FB_DATABASE_URL  (same as DATABASE_URL in ~/FlightBridgeEngine/.env on the Mac)
#   FB_SECRETS_KEY   (same as FB_SECRETS_KEY there; decrypts the mailbox password saved in the CRM)
name: Auto-Pilot cloud sender

on:
  schedule:
    - cron: "*/10 13-20 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: autopilot-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FLIGHTBRIDGE_DATABASE_URL: ${{ secrets.FB_DATABASE_URL }}
      FB_SECRETS_KEY: ${{ secrets.FB_SECRETS_KEY }}
      FB_RUNNER: github-actions
      DRY_RUN: "false"
      OUTBOUND_ENABLED: "true"
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$FLIGHTBRIDGE_DATABASE_URL" ] || [ -z "$FB_SECRETS_KEY" ]; then
            echo "::notice::Secrets FB_DATABASE_URL and FB_SECRETS_KEY are not set - nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: pip install --quiet -r requirements.txt
      - name: Send (only when the Mac is off)
        if: steps.cfg.outputs.ready == 'true'
        run: python -m flightbridge.cli cloud-send --minutes 9 2>/dev/null
